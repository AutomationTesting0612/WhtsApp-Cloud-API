\<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login | WhatsApp Message POC</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #1e3c72, #2a5298);
            height: 100vh;
            margin: 0;
        }

        .glass-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .form-label {
            color: #f1f1f1;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
        }

        .form-control::placeholder {
            color: #ccc;
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .btn-success {
            background-color: #28a745;
            border: none;
        }

        .btn-success:hover {
            background-color: #218838;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="card glass-card shadow-lg p-4" style="width: 400px;">
    <div class="card-header text-center border-0 bg-transparent mb-3">
        <h3 class="text-white mb-0">🔐 <strong>Admin Login</strong></h3>
    </div>
    <div class="card-body">
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">👤 Username</label>
                <input type="text" class="form-control" name="username" id="username" required autofocus placeholder="Enter username">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">🔑 Password</label>
                <input type="password" class="form-control" name="password" id="password" required placeholder="Enter password">
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-success">🚀 Login</button>
            </div>
        </form>

        <div class="mt-3 text-center text-warning" th:if="${param.error}">
            ❌ Invalid username or password
        </div>

        <div class="mt-2 text-center text-success" th:if="${param.logout}">
            ✅ You have been logged out successfully
        </div>
    </div>
</div>
</body>
</html>

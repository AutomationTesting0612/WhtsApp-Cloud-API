<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
        background: linear-gradient(to right, #1e3c72, #2a5298);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: Arial, sans-serif;
    }
    .card {
        background: rgba(255, 255, 255, 0.1);
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }
    .btn-option {
        width: 250px;
        margin: 15px;
        font-size: 18px;
    }
  </style>
</head>
<body>
<div class="card">
  <h2>📊 Welcome to the Dashboard</h2>
  <a href="/whatsapp/bulk-template-form" class="btn btn-success btn-option">📨 Messaging Service</a><br>
  <a href="/whatsapp/extract" class="btn btn-primary btn-option">🧾 Extract & Download CSV</a>
  <a href="/subscription/subscription-status">Subscription Status</a>
  <form th:action="@{/logout}" method="post" class="mt-4">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit" class="btn btn-danger btn-option">🚪 Logout</button>
  </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Campaigns</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Campaign List</h2>
    <a th:href="@{/campaign/new}" class="btn btn-success mb-3">Create New Campaign</a>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Name</th>
            <th>Message</th>
            <th>Schedule Time</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="campaign : ${campaigns}">
            <td th:text="${campaign.name}"></td>
            <td th:text="${campaign.message}"></td>
            <td th:text="${campaign.scheduleTime}"></td>
            <td th:text="${campaign.status}"></td>
            <td>
                <a th:href="@{'/campaign/edit/' + ${campaign.id}}" class="btn btn-primary btn-sm">Edit</a>
                <a th:href="@{'/campaign/delete/' + ${campaign.id}}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

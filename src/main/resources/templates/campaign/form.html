<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create/Edit Campaign</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <form th:action="@{/campaign/save}" th:object="${campaign}" method="post">
        <h2 th:text="${campaign.id != null} ? 'Edit Campaign' : 'New Campaign'">Campaign Form</h2>
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label>Name</label>
            <input type="text" class="form-control" th:field="*{name}"/>
        </div>
        <div class="mb-3">
            <label>Message</label>
            <textarea class="form-control" th:field="*{message}"></textarea>
        </div>
        <div class="mb-3">
            <label>Schedule Time</label>
            <input type="datetime-local" class="form-control" th:field="*{scheduleTime}"/>
        </div>
        <div class="mb-3">
            <label>Status</label>
            <input type="text" class="form-control" th:field="*{status}"/>
        </div>
        <div class="mb-3">
            <label>Segment</label>
            <select class="form-select" th:field="*{segment.id}">
                <option th:each="segment : ${segments}" th:value="${segment.id}" th:text="${segment.name}">Segment</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/campaign/list}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>

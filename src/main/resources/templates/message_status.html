<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Message Delivery Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h3 class="mb-4">📊 Message Delivery Status</h3>
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>Message ID</th>
            <th>Recipient</th>
            <th>Status</th>
            <th>Timestamp</th>
            <th>Error</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="msg : ${messages}">
            <td th:text="${msg.messageId}">MessageID</td>
            <td th:text="${msg.recipientId}">Recipient</td>
            <td th:text="${msg.status}">Status</td>
            <td th:text="${msg.timestamp}">Timestamp</td>
            <td th:text="${msg.errorReason ?: '—'}">Error</td>
        </tr>
        </tbody>
    </table>
    <a href="/whatsapp/bulk-template-form" class="btn btn-secondary">⬅️ Back</a>
</div>
</body>
</html>

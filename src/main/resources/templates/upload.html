<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSV Column Extractor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
        background: linear-gradient(to right, #1e3c72, #2a5298);
        height: 100vh;
        margin: 0;
    }

    .glass-card {
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
    }

    .form-label {
        color: #f1f1f1;
    }

    .form-control {
        background-color: rgba(255, 255, 255, 0.15);
        border: none;
        color: #fff;
    }

    .form-control::placeholder {
        color: #ddd;
    }

    .form-control:focus {
        background-color: rgba(255, 255, 255, 0.25);
        color: #fff;
    }

    .btn-primary {
        background-color: #007bff;
        border: none;
    }

    .btn-primary:hover {
        background-color: #0056b3;
    }

    .alert-success {
        background-color: #28a745;
        color: white;
    }

    .download-link a {
        color: #fff;
        text-decoration: underline;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="container">
  <div class="card glass-card shadow-lg p-4 mt-5">
    <div class="card-header text-white bg-transparent border-bottom-0 mb-3">
      <h3 class="mb-0">🧾 CSV Column Extractor</h3>
      <div class="d-flex gap-2">
      <a href="/whatsapp/dashboard" class="btn btn-success mt-3">🔙 Back to Dashboard</a>
        <form th:action="@{/logout}" method="post" class="mb-0">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-success mt-3">🚀 Logout</button>
        </form>
      </div>
    </div>
    <div class="card-body">
      <form method="POST" enctype="multipart/form-data" action="/whatsapp/extract">
        <div class="mb-3">
          <label for="file" class="form-label">📂 Select CSV File:</label>
          <input type="file" class="form-control" id="file" name="file" required>
        </div>

        <div class="mb-3">
          <label for="columns" class="form-label">🔍 Enter Columns (comma-separated):</label>
          <input type="text" class="form-control" id="columns" name="columns" placeholder="name,email" required>
        </div>

        <div class="mb-3">
          <label for="url" class="form-label">🌐 Enter URL to Append:</label>
          <input type="text" class="form-control" id="url" name="url" placeholder="https://example.com" required>
        </div>

        <div class="text-end">
          <button type="submit" class="btn btn-primary">🚀 Extract & Download</button>
        </div>
      </form>

      <div class="mt-4">
        <p class="text-light" th:text="${message}"></p>
        <div class="download-link" th:if="${downloadLink}">
          <a th:href="${downloadLink}">⬇️ Download Processed CSV</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
